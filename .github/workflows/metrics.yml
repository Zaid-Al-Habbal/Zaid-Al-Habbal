name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'   # daily at midnight UTC
  workflow_dispatch:        # adds a manual "Run workflow" button
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  achievements:
    runs-on: ubuntu-latest
    steps:
      - name: Generate achievements card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.achievements.svg
          committer_branch: output
          base: ""
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_secrets: yes
          config_timezone: Asia/Damascus

  activity:
    runs-on: ubuntu-latest
    steps:
      - name: Generate activity graph
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.activity.svg
          committer_branch: output
          base: ""
          plugin_activity: yes
          plugin_activity_days: 14
          plugin_activity_limit: 5
          config_timezone: Asia/Damascus
